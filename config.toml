[server]
port = 8300
host = "0.0.0.0"
data_dir = "./data"
allowed_origins = [
  "http://192.168.50.201:8300",
  "https://agentteam.dacitech.com.tw",
]

# Add agents here. Each gets a status pill, @mention routing, and color.
# "cwd" is the working directory for the agent's terminal session.
# "command" is the CLI command (must be on PATH).

[agents.claude]
command = "claude"
cwd = "/Users/jackyho/GitHub/dacitech-temple-erp"
color = "#da7756"
label = "Claude"

[agents.codex]
command = "codex"
cwd = "/Users/jackyho/GitHub/dacitech-temple-erp"
color = "#10a37f"
label = "Codex"

[agents.gemini]
command = "gemini"
cwd = ".."
color = "#4285f4"
label = "Gemini"

[agents.antigravity]
command = "agy"
cwd = "/Users/jackyho/GitHub/dacitech-temple-erp"
color = "#7c3aed"
label = "Antigravity"

[agents.grok]
command = "grok"
cwd = "/Users/jackyho/GitHub/dacitech-temple-erp"
color = "#06b6d4"
label = "Grok Build"

[agents.kimi]
command = "kimi"
cwd = ".."
color = "#1783ff"
label = "Kimi"

[agents.qwen]
command = "qwen"
cwd = ".."
color = "#8b5cf6"
label = "Qwen"
mcp_inject = "settings_file"
mcp_settings_path = ".qwen/settings.json"
mcp_transport = "http"
inject_delay = 1.0

[agents.kilo]
command = "kilo"
cwd = ".."
color = "#f7f677"
label = "Kilo"

[agents.codebuddy]
command = "codebuddy"
cwd = ".."
color = "#6C4DFF"
label = "CodeBuddy"
mcp_inject = "settings_file"
mcp_settings_path = "~/.codebuddy/.mcp.json"
mcp_transport = "http"
mcp_http_key = "url"

[agents.copilot]
command = "copilot"
cwd = ".."
color = "#8534F3"
label = "Copilot"
mcp_inject = "settings_file"
mcp_settings_path = "~/.copilot/mcp-config.json"
mcp_transport = "http"
mcp_http_key = "url"
enter_backend = "wm_setfocus"

[agents.minimax]
type = "api"
base_url = "https://api.minimax.io/v1"
model = "MiniMax-M2.7"
color = "#2fe898"
label = "MiniMax"
api_key_env = "MINIMAX_API_KEY"
temperature = 1.0

[routing]
# "none" = only route on explicit @mention. "all" = route to all agents by default.
default = "none"
max_agent_hops = 4
auto_dispatch = true
# 0 = no fixed cap; orchestrator may coordinate every matching/explicitly requested agent.
auto_dispatch_max_targets = 0
auto_dispatch_announce = true
commander_watchdog_seconds = 180
# Active lanes older than this are released instead of restored after restart.
commander_restore_max_age_seconds = 43200
# Commander lanes get a larger hop budget than ordinary agent chatter.
# 0 disables the hop cap inside commander lanes.
commander_lane_max_hops = 16

[mcp]
http_port = 8200
sse_port = 8201

[images]
upload_dir = "./uploads"
max_size_mb = 10

# --- MCP injection modes ---
# By default, claude/codex/antigravity/grok/gemini/kimi/kilo use built-in MCP config injection.
# For other CLI agents, set mcp_inject to tell the wrapper how to inject auth:
#
# mcp_inject modes:
#   "settings_file" — write a JSON settings file at mcp_settings_path (merges, not overwrites)
#   "env"           — write a settings file, expose path via mcp_env_var
#   "flag"          — write a config file, pass via CLI flag (mcp_flag, default: --mcp-config)
#   "proxy_flag"    — start a local proxy, pass URL via CLI flag template
#   "antigravity_plugin" — write ~/.gemini/config/plugins/agentchattr/mcp_config.json
#   "grok_config"   — write a managed MCP block in ~/.grok/config.toml
#
# Example: Qwen Code CLI
#   [agents.qwen]
#   command = "qwen"
#   cwd = ".."
#   color = "#8b5cf6"
#   label = "Qwen"
#   mcp_inject = "settings_file"
#   mcp_settings_path = ".qwen/settings.json"
#   mcp_transport = "http"
#
# Example: CLI with env var for settings
#   [agents.mycli]
#   command = "mycli"
#   mcp_inject = "env"
#   mcp_env_var = "MYCLI_MCP_SETTINGS"
#   mcp_transport = "http"

# --- API agents (local models) ---
# Add local model agents in config.local.toml (gitignored).
# Example config.local.toml:
#
#   [agents.qwen]
#   type = "api"
#   base_url = "http://localhost:8189/v1"
#   model = "qwen3-4b"
#   color = "#8b5cf6"
#   label = "Qwen"
#   # api_key_env = "MY_API_KEY"     # optional: env var name for API key
#   # system_prompt = "You are ..."   # optional: custom system prompt
#
# Then run: python wrapper_api.py qwen
