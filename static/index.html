<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>agentchattr</title>
    <link rel="stylesheet" href="/static/style.css?v=316">
    <link rel="stylesheet" href="/static/sessions.css?v=224">
    <link rel="stylesheet" href="/static/jobs.css?v=224">
    <link rel="icon" href="/static/favicon.ico">
    <script>
        // Apply persisted theme before paint to avoid FOUC
        (function() {
            try {
                var t = localStorage.getItem('agentchattr-theme') || 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div id="app" class="app-shell">
        <header class="topbar">
            <div class="header-right">
                <div id="agent-status"></div>
                <button class="settings-btn mobile-nav-btn" id="mobile-nav-toggle" onclick="toggleMobileNav()" title="Navigation" aria-label="Open navigation" aria-expanded="false">
                    <span class="icon" data-lucide="menu" aria-hidden="true"></span>
                </button>
                <button class="settings-btn" id="jobs-toggle" onclick="toggleJobsPanel()" title="Jobs">
                    <span class="icon" data-lucide="clipboard-list" aria-hidden="true"></span>
                    <span class="jobs-badge hidden" id="jobs-badge">0</span>
                </button>
                <button class="settings-btn" id="rules-toggle" onclick="toggleRulesPanel()" title="Rules">
                    <span class="icon" data-lucide="square-check-big" aria-hidden="true"></span>
                    <span class="rules-badge hidden" id="rules-badge">0</span>
                </button>
                <button class="settings-btn" id="pins-toggle" onclick="togglePinsPanel()" title="Pinned messages">
                    <span class="icon" data-lucide="pin" aria-hidden="true"></span>
                </button>
                <button class="settings-btn danger-action" id="stop-agents-btn" onclick="stopAllAgents()" title="Stop all agents" aria-label="Stop all agents">
                    <span class="icon" data-lucide="power" aria-hidden="true"></span>
                </button>
                <button class="settings-btn" id="settings-toggle" onclick="toggleSettings()" title="Settings">
                    <span class="icon" data-lucide="settings" aria-hidden="true"></span>
                </button>
                <button class="settings-btn" id="help-btn" onclick="toggleHelp()" title="Help">
                    <span class="icon" data-lucide="circle-help" aria-hidden="true"></span>
                </button>
                <button class="settings-btn theme-toggle-btn" id="theme-toggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle dark/light theme" aria-pressed="true">
                    <span class="icon theme-icon-dark" data-lucide="moon" aria-hidden="true"></span>
                    <span class="icon theme-icon-light" data-lucide="sun" aria-hidden="true"></span>
                </button>
            </div>
        </header>

        <div id="settings-bar" class="hidden">
            <div class="settings-field">
                <label for="setting-username">Name</label>
                <input type="text" id="setting-username" placeholder="your name" maxlength="20">
            </div>
            <div class="settings-field">
                <label for="setting-font">Font</label>
                <select id="setting-font">
                    <option value="mono">Monospace</option>
                    <option value="sans">Sans</option>
                </select>
            </div>
            <div class="settings-field">
                <label for="setting-hops">Loop guard</label>
                <div class="sched-num-wrap">
                    <input type="number" id="setting-hops" class="sched-pop-num" min="1" max="1000" value="4" title="Max agent-to-agent hops before pausing">
                    <div class="sched-num-btns">
                        <button type="button" onclick="stepNumInput('setting-hops',1)" tabindex="-1" aria-label="Increase">
                            <span class="icon" data-lucide="chevron-up" aria-hidden="true"></span>
                        </button>
                        <button type="button" onclick="stepNumInput('setting-hops',-1)" tabindex="-1" aria-label="Decrease">
                            <span class="icon" data-lucide="chevron-down" aria-hidden="true"></span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="settings-field">
                <label for="setting-history">History</label>
                <select id="setting-history">
                    <option value="all">All</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="200">200</option>
                    <option value="500">500</option>
                </select>
            </div>
            <div class="settings-field">
                <label for="setting-contrast">Contrast</label>
                <select id="setting-contrast">
                    <option value="normal">Normal</option>
                    <option value="high">High</option>
                </select>
            </div>
            <div class="settings-field">
                <label for="setting-channel-sidebar">Channels</label>
                <select id="setting-channel-sidebar" title="Show channels in a sidebar (Discord/Slack-style) instead of a top bar">
                    <option value="top">Top bar</option>
                    <option value="sidebar" selected>Sidebar</option>
                </select>
            </div>
            <div class="settings-field">
                <label for="setting-rules-refresh">Rule refresh</label>
                <select id="setting-rules-refresh" title="How often to re-send active rules to agents">
                    <option value="0">On rule changes</option>
                    <option value="5">Every 5 triggers</option>
                    <option value="10" selected>Every 10 triggers</option>
                    <option value="20">Every 20 triggers</option>
                    <option value="50">Every 50 triggers</option>
                </select>
            </div>
            <div class="settings-divider"></div>
            <div class="settings-field">
                <div id="sound-settings"></div>
            </div>
            <div class="settings-divider"></div>
            <div class="settings-field">
                <label>Project History</label>
                <div class="settings-history-btns">
                    <button class="settings-btn" onclick="exportHistory()">Export History</button>
                    <button class="settings-btn" id="import-history-btn" onclick="document.getElementById('import-file').click()">Import History</button>
                    <input type="file" id="import-file" accept=".zip" style="display:none" onchange="importHistory(this)">
                </div>
            </div>
        </div>

        <div id="pins-panel" class="hidden">
            <div class="pins-header">
                <span>Pinned</span>
            </div>
            <div id="pins-list"></div>
        </div>

        <div id="channel-bar">
            <div class="channel-bar-left-spacer" aria-hidden="true"></div>
            <div class="channel-main">
                <div id="channel-tabs"></div>
                <button id="channel-add-btn" class="channel-add" onclick="showChannelCreateDialog()" title="Add channel" aria-label="Add channel">
                    <span class="icon" data-lucide="plus" aria-hidden="true"></span>
                </button>
            </div>
            <div class="channel-bar-right">
                <a id="update-pill" class="update-pill hidden" href="" target="_blank" rel="noopener"></a>
            </div>
        </div>

        <div id="session-bar" class="hidden">
            <div class="session-info">
                <span class="session-template"></span>
                <span class="session-phase"></span>
                <span class="session-waiting"></span>
            </div>
            <div id="session-end-controls" class="session-end-controls">
                <button id="session-jump-btn" class="session-jump-btn hidden" onclick="jumpToSessionChannel()">Go to channel</button>
                <button id="session-end-btn" class="session-end-btn" onclick="toggleEndSessionConfirm(event)">End Session</button>
            </div>
        </div>

        <div id="content-area" class="content-area content-grid">
            <aside id="channel-sidebar" class="hidden">
                <div id="channel-sidebar-top"></div>
                <div class="channel-sidebar-header">
                    <span>Channels</span>
                    <button id="channel-sidebar-add" class="channel-sidebar-header-add" onclick="showChannelCreateDialog()" title="Add channel" aria-label="Add channel">
                        <span class="icon" data-lucide="plus" aria-hidden="true"></span>
                    </button>
                </div>
                <div id="channel-sidebar-list"></div>
                <div class="channel-sidebar-grip" id="channel-sidebar-grip"></div>
            </aside>
            <div id="mobile-nav-drawer" class="mobile-nav-drawer hidden" aria-label="Mobile navigation">
                <div class="mobile-nav-head">
                    <span>agentchattr</span>
                    <button type="button" onclick="toggleMobileNav(false)" aria-label="Close navigation">
                        <span class="icon" data-lucide="x" aria-hidden="true"></span>
                    </button>
                </div>
                <div class="mobile-nav-section">
                    <a href="/" onclick="toggleMobileNav(false)">Chat</a>
                    <a href="/search">Search</a>
                    <a href="/files">Files</a>
                    <a href="/notifications">Notifications</a>
                    <a href="/member">Member</a>
                    <a href="/settings">Settings</a>
                </div>
                <div class="mobile-nav-section mobile-nav-channels">
                    <span class="mobile-nav-label">Channels</span>
                    <div id="mobile-nav-channel-list"></div>
                </div>
            </div>
            <button id="mobile-nav-scrim" class="mobile-nav-scrim hidden" type="button" onclick="toggleMobileNav(false)" aria-label="Close navigation"></button>
            <main id="timeline">
                <div id="loading-indicator">
                    <div class="loading-spinner"></div>
                    <span>Loading messages...</span>
                </div>
                <div id="messages"></div>
                <div id="typing-indicator" class="hidden now-typing" aria-live="polite"></div>
            </main>
            <aside id="jobs-panel" class="hidden">
                <div class="jobs-grip" id="jobs-grip"></div>
                <div id="jobs-list-view">
                    <div class="jobs-header">
                        <span>Jobs</span>
                    <button class="jobs-create-btn" onclick="showCreateJob()" title="Create Job" aria-label="Create Job">
                        <span class="icon" data-lucide="plus" aria-hidden="true"></span>
                    </button>
                    </div>
                    <div id="jobs-list"></div>
                </div>
                <div id="jobs-conversation-view" class="hidden">
                    <div class="jobs-conv-header">
                        <button class="jobs-back-btn" onclick="jobsBack()" title="Back" aria-label="Back">
                            <span class="icon" data-lucide="arrow-left" aria-hidden="true"></span>
                        </button>
                        <span class="jobs-conv-title" id="jobs-conv-title"></span>
                        <div class="jobs-status-toggles" id="jobs-status-toggles">
                            <button class="job-toggle open" data-status="open" onclick="toggleJobStatus('open')" title="To Do">TO DO</button>
                            <button class="job-toggle done" data-status="done" onclick="toggleJobStatus('done')" title="Active">ACTIVE</button>
                            <button class="job-toggle archived" data-status="archived" onclick="toggleJobStatus('archived')" title="Closed">CLOSED</button>
                        </div>
                    </div>
                    <div class="jobs-conv-messages" id="jobs-conv-messages"></div>
                    <div class="jobs-conv-input">
                        <div id="job-mention-menu" class="mention-menu hidden"></div>
                        <div id="job-attachments" class="job-attachments"></div>
                        <div class="job-reply-target-row hidden" id="job-reply-target-row">
                            <button class="job-reply-target-btn" id="job-reply-target-btn" type="button" onclick="cycleJobReplyTarget()" title="Reply target">
                                <span class="job-reply-target-prefix">To</span>
                                <span class="job-reply-target-dot" id="job-reply-target-dot"></span>
                                <span class="job-reply-target-name" id="job-reply-target-name"></span>
                            </button>
                            <button class="job-reply-target-clear hidden" id="job-reply-target-clear" type="button" onclick="clearJobReplyTarget(event)" title="Clear reply target" aria-label="Clear reply target">
                                <span class="icon" data-lucide="x" aria-hidden="true"></span>
                            </button>
                        </div>
                        <div class="job-input-row">
                            <textarea id="jobs-conv-input-text" placeholder="Message..." rows="1"></textarea>
                            <button onclick="sendJobMessage()">Send</button>
                        </div>
                    </div>
                </div>
            </aside>
            <aside id="rules-panel" class="hidden">
                <div class="rules-grip" id="rules-grip"></div>
                <div class="rules-header">
                    <span>Rules</span>
                    <span class="rules-counter" id="rules-counter"></span>
                    <button class="rules-remind-btn" onclick="remindAgents()">Remind agents</button>
                    <button class="jobs-create-btn" onclick="showCreateRule()" title="Add Rule" aria-label="Add Rule">
                        <span class="icon" data-lucide="plus" aria-hidden="true"></span>
                    </button>
                </div>
                <div id="rules-list"></div>
            </aside>
        </div>

        <div id="scroll-anchor" class="hidden" onclick="scrollToBottom()"><span class="unread-badge">0</span><span class="icon" data-lucide="arrow-down" aria-hidden="true"></span></div>

        <footer>
            <div id="schedules-bar" class="hidden">
                <div class="schedules-bar-summary">
                    <span class="schedules-icon icon" data-lucide="clock" aria-hidden="true"></span>
                    <span class="schedules-count" id="schedules-count"></span>
                    <span class="schedules-next" id="schedules-next"></span>
                    <a class="schedules-see-all" onclick="toggleSchedulesExpand()">See all</a>
                </div>
                <div class="schedules-bar-list hidden" id="schedules-list"></div>
            </div>
            <div id="mention-toggles-row">
                <div id="mention-toggles"></div>
                <button id="clear-chat-btn" class="ghost-btn" onclick="clearChat()" title="Clear chat in this channel">Clear Chat</button>
            </div>
            <div id="slash-menu" class="hidden"></div>
            <div id="mention-menu" class="hidden"></div>
            <div id="attachments"></div>
            <div id="input-row">
                <textarea id="input"
                    placeholder="Type a message... (use @name to mention agents)"
                    rows="2"
                    autofocus></textarea>
                <div class="composer-row">
                    <input type="file" id="composer-file-input" accept="image/*" multiple hidden onchange="handleComposerFileSelect(this)">
                    <button id="attach-btn" class="toolbtn" type="button" onclick="document.getElementById('composer-file-input').click()" title="Attach image" aria-label="Attach image">
                        <span class="icon" data-lucide="paperclip" aria-hidden="true"></span>
                    </button>
                    <button id="session-launch-btn" class="toolbtn" onclick="showSessionLauncher()" title="Start a session" aria-label="Start a session">
                        <span class="icon" data-lucide="play" aria-hidden="true"></span>
                    </button>
                    <button id="mention-tool-btn" class="toolbtn" type="button" onclick="insertComposerToken('@')" title="Mention" aria-label="Mention">
                        <span class="icon" data-lucide="at-sign" aria-hidden="true"></span>
                    </button>
                    <button id="slash-tool-btn" class="toolbtn mono" type="button" onclick="insertComposerToken('/')" title="Slash command" aria-label="Slash command">
                        <span class="icon" data-lucide="slash" aria-hidden="true"></span>
                    </button>
                    <button id="code-tool-btn" class="toolbtn" type="button" onclick="insertComposerCodeBlock()" title="Code block" aria-label="Code block">
                        <span class="icon" data-lucide="code-xml" aria-hidden="true"></span>
                    </button>
                    <button id="mic" class="toolbtn" type="button" onmousedown="event.preventDefault()" onclick="toggleVoice()" title="Voice typing (local speech-to-text)" aria-label="Voice typing" aria-pressed="false">
                        <span id="mic-icon" class="icon" data-lucide="mic" aria-hidden="true"></span>
                    </button>
                    <span class="spacer"></span>
                    <span id="sender-label" class="sender-label">user</span>
                    <span class="input-hint">
                        Enter to send &middot; Shift+Enter newline
                    </span>
                    <div class="send-group">
                        <button id="send" onclick="sendMessage()">Send</button>
                        <button id="schedule-btn" class="send-clock" onclick="toggleSchedulePopover(event)" title="Schedule message" aria-label="Schedule message">
                            <span class="icon" data-lucide="clock" aria-hidden="true"></span>
                        </button>
                    </div>
                </div>
                <div id="schedule-popover" class="schedule-popover hidden">
                    <div class="sched-pop-header">
                        <span>Schedule message</span>
                        <button class="sched-pop-close" onclick="closeSchedulePopover()" aria-label="Close schedule">
                            <span class="icon" data-lucide="x" aria-hidden="true"></span>
                        </button>
                    </div>
                    <div class="sched-pop-body">
                        <div class="sched-pop-row">
                            <label class="sched-pop-label">When</label>
                            <select id="sched-date" class="sched-pop-select"></select>
                        </div>
                        <div class="sched-pop-row sched-time-row">
                            <label class="sched-pop-label">At</label>
                            <select id="sched-hour" class="sched-pop-select sched-pop-select-sm"></select>
                            <span class="sched-time-colon">:</span>
                            <select id="sched-minute" class="sched-pop-select sched-pop-select-sm"></select>
                            <select id="sched-ampm" class="sched-pop-select sched-pop-select-sm"></select>
                        </div>
                        <div class="sched-pop-row">
                            <label class="sched-pop-check">
                                <input type="checkbox" id="sched-recurring" onchange="toggleRecurringFields()">
                                <span>Recurring</span>
                            </label>
                        </div>
                        <div class="sched-pop-row sched-recurring-fields hidden" id="sched-recurring-fields">
                            <label class="sched-pop-label">Every</label>
                            <div class="sched-num-wrap">
                                <input type="number" id="sched-interval-val" class="sched-pop-num" value="1" min="1" max="99">
                                <div class="sched-num-btns">
                                    <button type="button" onclick="stepSchedNum(1)" tabindex="-1" aria-label="Increase">
                                        <span class="icon" data-lucide="chevron-up" aria-hidden="true"></span>
                                    </button>
                                    <button type="button" onclick="stepSchedNum(-1)" tabindex="-1" aria-label="Decrease">
                                        <span class="icon" data-lucide="chevron-down" aria-hidden="true"></span>
                                    </button>
                                </div>
                            </div>
                            <select id="sched-interval-unit" class="sched-pop-select">
                                <option value="minutes">minutes</option>
                                <option value="hours" selected>hours</option>
                                <option value="days">days</option>
                            </select>
                        </div>
                    </div>
                    <div class="sched-pop-error hidden" id="sched-pop-error"></div>
                    <div class="sched-pop-footer">
                        <button class="sched-pop-cancel" onclick="closeSchedulePopover()">Cancel</button>
                        <button class="sched-pop-submit" onclick="submitSchedulePopover()">Schedule</button>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <div id="dropzone" class="hidden">
        <div class="dropzone-inner">Drop image here</div>
    </div>

    <script src="/static/marked.min.js?v=14.1.4"></script>
    <script src="/static/lucide.min.js?v=1.8.0"></script>
    <script src="/static/core.js?v=223"></script>
    <script src="/static/store.js?v=223"></script>
    <script src="/static/sessions.js?v=223"></script>
    <script src="/static/jobs.js?v=224"></script>
    <script src="/static/channels.js?v=226"></script>
    <script src="/static/rules-panel.js?v=223"></script>
    <script src="/static/chat.js?v=275"></script>
</body>
</html>
